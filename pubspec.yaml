name: tc_movie
description: "TC Movie App - A Flutter movie application for iOS and Android."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  skills: ^0.3.1
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  go_router: ^15.1.2
  dio: ^5.8.0+1
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.5
  flutter_localization: ^0.4.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.17
  lottie: ^3.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - .env.dev
    - .env.stage
    - .env.prod
    - assets/images/
    - assets/icons/
    - assets/svgs/
    - assets/animations/
    - assets/langs/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic
    - family: Hanuman
      fonts:
        - asset: assets/fonts/Hanuman/Hanuman-VariableFont_wght.ttf
